<!doctype html>
<!--
  Source of docs/readme-banner.jpg (2560×840). Render it from the repo root at 2× with headless Chrome:

    chrome --headless --hide-scrollbars --window-size=1280,420 --force-device-scale-factor=2 \
      --virtual-time-budget=8000 --screenshot=banner.png docs/design/readme-banner.html
    sips -s format jpeg -s formatOptions 82 banner.png --out docs/readme-banner.jpg
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meerko README banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@600&family=Silkscreen&display=block" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a0b;
        --fg: #f4f4f5;
        --gray: #5a5a63;
        --lime: #a8f326;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 420px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 420px;
        overflow: hidden;
      }
      .art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 12%;
      }
      /* Night falls over the left, where the text sits; the meerkat and the moon stay lit. */
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(10 10 11 / 0.86) 0%, rgb(10 10 11 / 0.76) 38%, rgb(10 10 11 / 0.3) 62%, rgb(10 10 11 / 0) 78%),
          linear-gradient(180deg, rgb(10 10 11 / 0) 70%, rgb(10 10 11 / 0.6) 100%);
      }
      .frame {
        position: absolute;
        inset: 0;
        border: 1px solid #2a2a2f;
      }
      .copy {
        position: absolute;
        left: 64px;
        top: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .mono {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--lime);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--lime);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 26px;
      }
      .brand img {
        height: 74px;
      }
      .wordmark {
        font-family: "Silkscreen", ui-monospace, monospace;
        font-size: 78px;
        line-height: 1;
        letter-spacing: 0;
      }
      .wordmark b {
        font-weight: 400;
        color: var(--lime);
      }
      .tagline {
        margin-top: 26px;
        font-family: "Inter", ui-sans-serif, sans-serif;
        font-size: 33px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.9px;
      }
      .chips {
        display: flex;
        gap: 9px;
        margin-top: 30px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        font-size: 12px;
        background: rgb(10 10 11 / 0.72);
        border: 1px solid var(--gray);
        white-space: nowrap;
      }
      .chip.live {
        border-color: var(--lime);
        font-weight: 600;
      }
      .chip .dot {
        width: 6px;
        height: 6px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <img class="art" src="../../apps/web/public/landing/lookout-night.jpg" alt="" />
      <div class="shade"></div>
      <div class="copy">
        <div class="mono eyebrow"><span class="dot"></span>The open-source GTM agent · meerko.ai</div>
        <div class="brand">
          <img src="../../apps/web/public/meerko-mark.svg" alt="" />
          <span class="wordmark">MEER<b>KO</b></span>
        </div>
        <div class="tagline">The outbound engine for your AI agent.</div>
        <div class="chips">
          <span class="mono chip live"><span class="dot"></span>Works in Claude · ChatGPT</span>
          <span class="mono chip">Your own inbox</span>
          <span class="mono chip">MCP · CLI · API</span>
          <span class="mono chip">Open source · AGPL-3.0</span>
        </div>
      </div>
      <div class="frame"></div>
    </div>
  </body>
</html>
