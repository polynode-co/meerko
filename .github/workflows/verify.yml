name: verify

on:
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here pushes, comments or deploys.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # dev -> main pull requests break fast-forward promotion; fail them on sight.
  promotion-shape:
    name: promotion shape
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev'
    steps:
      - name: Reject dev -> main pull requests
        run: |
          echo "::error::Don't promote with a pull request from dev into main."
          echo "It puts a merge commit on main that dev doesn't have, which blocks fast-forward promotion."
          echo ""
          echo "Close this PR and run the 'promote' workflow instead (Actions -> promote, type 'promote'),"
          echo "or from a terminal: git push origin origin/dev:refs/heads/main"
          exit 1

  # The promote gate: promote.yml runs only by hand, behind the typed confirmation.
  promote-gate:
    name: promote gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/promote-gate.test.sh

  # Every pull request, forks included: typecheck and the unit tests. It uses no secrets, and the
  # database tests skip (no DATABASE_URL). Keep the trigger pull_request, never pull_request_target:
  # this job runs the pull request's own code.
  checks:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
