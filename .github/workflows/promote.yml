name: promote

# Promotes dev to main (production) by fast-forward, the only supported way to release.
#
# Release rhythm: this never runs on its own. A release ships when a maintainer runs it by hand
# (Actions -> promote, type "promote"), after the release gate briefing (09:00, 15:00 and 21:00
# Madrid time). It ships everything on dev, so hold a risky PR unmerged until it's ready to go
# out. There is no schedule on purpose (scripts/promote-gate.test.sh fails if one comes back).
#
# A pull request from dev into main leaves a merge commit on main that dev never has, so main
# diverges and every later fast-forward is rejected. Fast-forwarding keeps main byte-identical
# to dev, so "what's in production" is never a question.
#
# Pushing to main fires the prd Cloud Build triggers. Cloud Build is a GitHub App, so it gets
# the push webhook even though the push comes from GITHUB_TOKEN.
#
# Every promote that ships something ends in a GitHub Release tagged prd-YYYY-MM-DD (Madrid
# date; a second release the same day gets .2, .3, ...), listing the commits it shipped. The tag is the
# exact commit prd runs, so it is also the rollback point. Tags never deploy: the prd triggers
# only match the main branch.
#
# Migrations run on deploy: the prd api build applies pending ones before the new revision takes
# traffic, and a failed one keeps the old revision serving (CLAUDE.md).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to deploy dev to production'
        required: true
        default: ''

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: fast-forward main to dev
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'promote'
        run: |
          echo "::error::Type 'promote' to confirm. This deploys dev to production."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # real history, to test ancestry

      - name: Verify main can fast-forward to dev
        run: |
          git fetch origin dev main
          DEV=$(git rev-parse origin/dev)
          MAIN=$(git rev-parse origin/main)

          if [ "$DEV" = "$MAIN" ]; then
            echo "::notice::main is already at dev ($DEV). Nothing to promote."
            echo "ALREADY_LEVEL=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Only possible when main is an ancestor of dev. If it isn't, main has commits dev
          # doesn't, almost always a merge commit from a dev->main pull request.
          if ! git merge-base --is-ancestor "$MAIN" "$DEV"; then
            echo "::error::main has diverged from dev, so it can't fast-forward."
            echo "Commits on main that dev doesn't have:"
            git log --oneline "$DEV..$MAIN"
            echo ""
            echo "To recover: git checkout dev && git merge origin/main && git push origin dev"
            echo "Confirm 'git rev-parse dev^{tree}' is unchanged by that merge, then re-run."
            exit 1
          fi

          echo "ALREADY_LEVEL=false" >> "$GITHUB_ENV"
          echo "FROM=$MAIN" >> "$GITHUB_ENV"
          echo "TO=$DEV" >> "$GITHUB_ENV"
          {
            echo "### Promoting to production"
            echo ""
            echo "\`$MAIN\` -> \`$DEV\`"
            echo ""
            git log --oneline --no-merges "$MAIN..$DEV" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fast-forward main
        if: env.ALREADY_LEVEL == 'false'
        run: |
          # A plain push is fast-forward only; git rejects anything else. Never --force: it would
          # rewrite production history.
          git push origin "$(git rev-parse origin/dev):refs/heads/main"
          echo "::notice::main is now at $(git rev-parse origin/dev). The prd Cloud Build triggers fire on this push."

      - name: Record the release
        if: env.ALREADY_LEVEL == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="prd-$(TZ=Europe/Madrid date +%Y-%m-%d)"
          TAG="$BASE"; N=1
          while git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git ls-remote --exit-code --tags origin "$TAG" >/dev/null; do
            N=$((N + 1)); TAG="$BASE.$N"
          done
          {
            echo "Promoted \`${FROM:0:8}\` -> \`${TO:0:8}\`."
            echo ""
            git log --format='- %s' --no-merges "$FROM..$TO"
          } > notes.md
          gh release create "$TAG" --target "$TO" --title "$TAG" --notes-file notes.md
          echo "::notice::Released $TAG."
